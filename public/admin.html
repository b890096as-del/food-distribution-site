<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap">
<header><h1>لوحة إدارة الموقع</h1><p>إدارة السجلات واستيراد Excel</p></header>
<section id="loginBox" class="panel login"><label>اسم المستخدم</label><input id="username"><label>كلمة المرور</label><input id="password" type="password"><button id="login">دخول</button><p id="loginMsg"></p></section>
<section id="adminBox" hidden>
<div class="panel"><h2>إضافة / تعديل سجل</h2><input id="rid" type="hidden">
<label>الاسم الثلاثي</label><input id="full_name">
<label>العدد في الحصة الغذائية</label><input id="food_count" type="number" min="0" value="0">
<label>العدد في الرعاية الاجتماعية</label><input id="welfare_count" type="number" min="0" value="0">
<label>العدد في حصة الطحين</label><input id="flour_count" type="number" min="0" value="0">
<label>تاريخ القائمة</label><input id="list_date" type="date">
<label>رقم البطاقة (خاص بالإدارة)</label><input id="card_number">
<button id="save">حفظ السجل</button><p id="msg"></p></div>
<div class="panel"><h2>استيراد ملف Excel</h2><p class="hint">الأعمدة المطلوبة: الاسم الثلاثي، العدد في الحصة الغذائية، العدد في الرعاية الاجتماعية، العدد في حصة الطحين، تاريخ القائمة، رقم البطاقة.</p><input id="excel" type="file" accept=".xlsx,.xls"><button id="import">استيراد</button><p id="importMsg"></p></div>
<div class="panel"><h2>السجلات</h2><button id="reload">تحديث القائمة</button><div id="records"></div><button id="logout" style="margin-top:12px;background:#ddd">تسجيل خروج</button></div>
</section></main><script src="/admin.js"></script></body></html>
